[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-context"
version = "0.1.0"
description = "Business context analysis and versioned test context packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
business-context = "workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingest*", "agent*", "facts*", "workflow*", "validation*", "adapters*"]
namespaces = false
